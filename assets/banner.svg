<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f24" />
      <stop offset="50%" stop-color="#0f173a" />
      <stop offset="100%" stop-color="#081026" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyanPurpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 42px; fill: #ffffff; }
    .subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 18px; fill: #94a3b8; }
    .badge-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #00f2fe; }
    
    /* Animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.08); }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-20px) translateX(10px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
    }
    @keyframes dashStream {
      0% { stroke-dashoffset: 1000; }
      100% { stroke-dashoffset: 0; }
    }
    
    .pulsing-orb-1 { animation: pulseGlow 6s ease-in-out infinite; transform-origin: 200px 100px; }
    .pulsing-orb-2 { animation: pulseGlow 8s ease-in-out infinite 2s; transform-origin: 1000px 300px; }
    .particle-1 { animation: floatParticle 5s ease-in-out infinite; }
    .particle-2 { animation: floatParticle 7s ease-in-out infinite 1s; }
    .particle-3 { animation: floatParticle 6s ease-in-out infinite 2.5s; }
    .stream-line { stroke-dasharray: 20 10; animation: dashStream 25s linear infinite; }
  </style>

  <!-- Base Canvas Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGradient)" />

  <!-- Background Dynamic Grid Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" />
    </pattern>
    <rect width="1200" height="400" fill="url(#grid)" />
  </g>

  <!-- Background Animated Glowing Orbs (Deep Layer) -->
  <circle class="pulsing-orb-1" cx="150" cy="80" r="140" fill="#00f2fe" filter="url(#softGlow)" />
  <circle class="pulsing-orb-2" cx="1050" cy="320" r="160" fill="#7c3aed" filter="url(#softGlow)" />

  <!-- Background Neural / Data Connections -->
  <g stroke="url(#cyanPurpleGrad)" stroke-width="1.5" opacity="0.3" fill="none">
    <path class="stream-line" d="M 50 350 Q 300 200 600 350 T 1150 50" />
    <path class="stream-line" d="M 100 50 Q 400 300 800 100 T 1100 350" />
  </g>

  <!-- Floating Dynamic Tech Particles -->
  <circle class="particle-1" cx="180" cy="140" r="4" fill="#00f2fe" />
  <circle class="particle-2" cx="1020" cy="120" r="5" fill="#38bdf8" />
  <circle class="particle-3" cx="940" cy="280" r="4" fill="#a78bfa" />
  <circle class="particle-1" cx="240" cy="290" r="6" fill="#34d399" />

  <!-- Foreground Glassmorphism Banner Card -->
  <rect x="60" y="50" width="1080" height="300" rx="12" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5" />

  <!-- Healthcare & NLP Graphical Accent Icons / Badges (Right side) -->
  <g transform="translate(880, 100)">
    <!-- Medical Cross & Neural Node Icon Circle -->
    <circle cx="90" cy="90" r="70" fill="#0f172a" stroke="url(#cyanPurpleGrad)" stroke-width="3" filter="url(#glow)" />
    <!-- Medical Cross -->
    <path d="M 80 50 H 100 V 80 H 130 V 100 H 100 V 130 H 80 V 100 H 50 V 80 H 80 Z" fill="#00f2fe" />
    <!-- Pulse Wave -->
    <path d="M 30 90 L 60 90 L 70 70 L 80 110 L 95 80 L 105 100 L 115 90 L 150 90" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Foreground Text Content (Prominent & Always Visible) -->
  <g transform="translate(110, 110)">
    <!-- Top Pill Badge -->
    <g transform="translate(0, 0)">
      <rect width="320" height="32" rx="16" fill="#00f2fe" fill-opacity="0.12" stroke="#00f2fe" stroke-opacity="0.4" stroke-width="1" />
      <text x="16" y="21" class="badge-text">🏥 CLINICAL &amp; BIOMEDICAL NLP 🧠</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="85" class="title" filter="url(#glow)">Healthcare Natural Language Processing</text>
    
    <!-- Subtitle -->
    <text x="0" y="130" class="subtitle">Top Enterprise Platforms, Clinical LLMs &amp; Open-Source NLP Libraries</text>

    <!-- Bottom Feature Tags -->
    <g transform="translate(0, 165)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="170" height="30" rx="6" fill="#ffffff" fill-opacity="0.06" stroke="#94a3b8" stroke-opacity="0.2" />
      <text x="12" y="20" font-family="Segoe UI, sans-serif" font-size="13" fill="#cbd5e1">🔬 Clinical NER &amp; Coding</text>

      <!-- Tag 2 -->
      <rect x="182" y="0" width="180" height="30" rx="6" fill="#ffffff" fill-opacity="0.06" stroke="#94a3b8" stroke-opacity="0.2" />
      <text x="194" y="20" font-family="Segoe UI, sans-serif" font-size="13" fill="#cbd5e1">🔒 PHI De-identification</text>

      <!-- Tag 3 -->
      <rect x="374" y="0" width="165" height="30" rx="6" fill="#ffffff" fill-opacity="0.06" stroke="#94a3b8" stroke-opacity="0.2" />
      <text x="386" y="20" font-family="Segoe UI, sans-serif" font-size="13" fill="#cbd5e1">⚡ ICD-10 &amp; SNOMED CT</text>
    </g>
  </g>
</svg>
